[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bakke-backend"
version = "0.1.0"
description = "BAKKE - Evidence-Constrained Hypothesis Intelligence backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0.35,<2.1",
  "psycopg2-binary>=2.9.9,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "httpx>=0.27,<1.0",
  "redis>=5.0,<6.0",
  "openai>=1.40,<2.0",
  "numpy>=1.26,<3.0",
  "python-docx>=1.1,<2.0",
  "pypdf>=4.2,<6.0",
  "email-validator>=2.1,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
