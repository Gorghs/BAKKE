services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bakke
      POSTGRES_PASSWORD: bakke
      POSTGRES_DB: bakke
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakke -d bakke"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg2://bakke:bakke@postgres:5432/bakke
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      VISION_PROVIDER: ${VISION_PROVIDER:-mock}
      VIDEO_UNDERSTANDING_PROVIDER: ${VIDEO_UNDERSTANDING_PROVIDER:-mock}
      VIDEO_GENERATION_PROVIDER: ${VIDEO_GENERATION_PROVIDER:-mock}
      VIDEO_GENERATION_API_KEY: ${VIDEO_GENERATION_API_KEY:-}
      VIDEO_GENERATION_MODEL: ${VIDEO_GENERATION_MODEL:-}
      VIDEO_GENERATION_BASE_URL: ${VIDEO_GENERATION_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-6}
      LLM_CALL_MIN_INTERVAL: ${LLM_CALL_MIN_INTERVAL:-0}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      MAX_REASONING_ITERATIONS: ${MAX_REASONING_ITERATIONS:-5}
      STALE_RUNNING_SECONDS: ${STALE_RUNNING_SECONDS:-900}
      TOP_N_DEFAULT: 10
      STORAGE_PROVIDER: local
      VIDEO_OUTPUT_DIR: /app/data/videos
    volumes:
      - ./backend:/app
      - bakkedata:/app/data
    ports:
      - "8000:8000"
    # The LLM bridge runs on the host (gemini-web-to-api, port 4981). Linux
    # containers get no host.docker.internal unless the gateway is mapped.
    extra_hosts: &backend_hosts
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    # No alembic here: backend owns migrations, and two services running
    # `upgrade head` at once race on creating alembic_version.
    command: sh -c "python -m app.jobs.worker"
    environment: *backend_env
    extra_hosts: *backend_hosts
    volumes:
      - ./backend:/app
      - bakkedata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  bakkedata:
